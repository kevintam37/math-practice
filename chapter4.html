<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapter 4 Measurement and Data</title>
<style>
:root{--bg:#FBF7EC;--ink:#26304A;--card:#fff;--line:#E4DCC9;--indigo:#2B3A67;--coral:#FF6B4A;--teal:#2A9D8F;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root{--bg:#1D2233;--ink:#F1ECDD;--card:#262B40;--line:#3A4159;--indigo:#F4C95D}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:21px;margin:0 0 2px;color:var(--indigo);line-height:1.25}.sub{font-size:14px;opacity:.7;margin:0 0 14px}
.row{display:flex;gap:8px;margin-bottom:10px}
button{font:inherit;cursor:pointer}
.pill{flex:1;padding:12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.les{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600}
.les small{font-weight:400;opacity:.65;font-size:13px}
.les:active{transform:scale(.99)}
.back{background:none;border:none;color:var(--indigo);font-weight:600;font-size:14px;padding:0 0 10px;cursor:pointer}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}
.track{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:14px}
.fill{height:100%;background:var(--teal);transition:width .3s}
.qn{font-size:12px;font-weight:700;color:var(--coral);margin-bottom:6px}
.qt{font-size:17px;font-weight:600;line-height:1.45;margin:0 0 12px;white-space:pre-line}
.pics{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pic{padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:20px;line-height:1.3}
.pic b{display:block;font-size:13px;font-family:system-ui;margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.lt{font-size:18px;min-width:26px;white-space:nowrap}
.opt.sel{border-color:var(--indigo);background:rgba(128,128,128,.14)}
.opt.ok{border-color:var(--teal);background:rgba(42,157,143,.16)}.opt.no{border-color:var(--coral);background:rgba(255,107,74,.16)}
input[type=text],select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]{width:140px}textarea{font:inherit;font-size:15px;width:100%;min-height:90px;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.f{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap;font-size:16px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:8px 6px;text-align:center}
.nb{margin-top:14px;width:100%;padding:13px;border:none;border-radius:12px;background:var(--indigo);color:#fff;font-weight:700;font-size:15px}
@media(prefers-color-scheme:dark){.nb{color:#1D2233}}
.nb.alt{background:var(--teal);color:#fff}.nb:disabled{opacity:.4}
.nb.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.fb{margin-top:12px;font-weight:600;font-size:14.5px;line-height:1.45}.good{color:var(--teal)}.bad{color:var(--coral)}
.model{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);font-size:14.5px;line-height:1.5}
.revh{margin:22px 0 8px;font-size:16px;color:var(--indigo)}.rev{text-align:left}.ri{border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.45}.ri.nor{border-left-color:var(--coral)}.rh{font-weight:700}.mk{font-size:18px;font-weight:800}.okr .mk{color:var(--teal)}.nor .mk{color:var(--coral)}.rq{opacity:.7;margin:2px 0 4px}.rc{color:var(--teal)}
.score{font-size:46px;font-weight:800;color:var(--indigo);text-align:center}.c{text-align:center}.small{font-size:13px;opacity:.7}
</style></head><body><div class="wrap">
<h1>Chapter 4 Measurement and Data</h1><p class="sub" id="sub">Pick a lesson to practice</p>
<div class="stage" id="st"></div>
</div>
<script>
const mc=(q,opts,a,exp,pics)=>({t:'mc',q,opts,a,exp,pics});

const RECTPIC=(a,b)=>`<div class="pics"><div class="pic" style="padding:8px;text-align:center"><div style="width:150px;height:80px;background:var(--indigo);opacity:.3;border:2px solid var(--ink);margin:0 auto 6px"></div><div class="small">${a} by ${b}</div></div></div>`;
const SHAPE=(type)=>{const svgs={rect:'<svg width="40" height="40" viewBox="0 0 40 40"><rect x="5" y="10" width="30" height="20" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>',star:'<span style="font-size:28px">⭐</span>',bolt:'<span style="font-size:28px">⚡</span>',pentagon:'<svg width="40" height="40" viewBox="0 0 40 40"><polygon points="20,4 36,16 30,36 10,36 4,16" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>',sun:'<span style="font-size:28px">☀️</span>',heart:'<span style="font-size:28px">❤️</span>',moon:'<span style="font-size:28px">🌙</span>',smiley:'<span style="font-size:28px">🙂</span>',trapezoid:'<svg width="50" height="40" viewBox="0 0 50 40"><polygon points="15,5 35,5 46,35 4,35" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>',parallelogram:'<svg width="50" height="40" viewBox="0 0 50 40"><polygon points="14,5 46,5 36,35 4,35" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>',rhombus:'<svg width="40" height="40" viewBox="0 0 40 40"><polygon points="20,3 37,20 20,37 3,20" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>',square:'<svg width="40" height="40" viewBox="0 0 40 40"><rect x="7" y="7" width="26" height="26" fill="none" stroke="var(--ink)" stroke-width="2"/></svg>'};return `<span style="display:inline-flex;align-items:center;justify-content:center;width:44px">${svgs[type]||''}</span>`};
const OPTSHAPE=(type,label)=>`<span style="display:inline-flex;align-items:center;gap:8px">${SHAPE(type)}<b>${label}</b></span>`;
const G=(r,c,s)=>`<div class="pics"><div class="pic" style="display:grid;grid-template-columns:repeat(${c},auto);gap:2px 6px;justify-content:start">${Array(r*c).fill(`<span>${s}</span>`).join('')}</div></div>`;
const RECT=(n,sh)=>{let b='';for(let i=0;i<n;i++){b+=`<div style="width:26px;height:40px;border:1px solid var(--ink);background:${i<sh?'var(--indigo)':'transparent'}"></div>`}return `<div class="pics"><div class="pic" style="display:flex;gap:2px;padding:8px">${b}</div></div>`};
const CIRC=(n,sh)=>{const pct=(sh/n*100).toFixed(2);return `<div class="pics"><div class="pic" style="padding:8px"><div style="width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--indigo) 0% ${pct}%, transparent ${pct}% 100%);border:2px solid var(--ink)"></div></div></div>`};
const STACK=(n)=>{let b='';for(let i=0;i<n;i++){b+=`<div style="width:60px;height:16px;border:1px solid var(--ink);background:var(--indigo);margin-bottom:2px;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center">10</div>`}return `<div class="pics"><div class="pic" style="padding:6px">${b}</div></div>`};
const NL=(n,k)=>{let ticks='';for(let t=0;t<=n;t++){ticks+=`<div style="position:absolute;left:calc(10px + (100% - 20px) * ${t} / ${n});top:22px;bottom:8px;width:1px;background:var(--ink);opacity:.5"></div>`}return `<div class="pics"><div class="pic" style="position:relative;height:46px;width:260px"><div style="position:absolute;left:10px;right:10px;top:26px;height:2px;background:var(--ink)"></div>${ticks}<div style="position:absolute;left:calc(10px + (100% - 20px) * ${k} / ${n});top:20px;width:12px;height:12px;border-radius:50%;background:var(--coral);transform:translateX(-6px)"></div><span style="position:absolute;left:6px;top:30px;font-size:11px">0</span><span style="position:absolute;right:6px;top:30px;font-size:11px">1</span></div></div>`};

const CLOCK=(h,m)=>{const hAngle=(h%12)*30+m*0.5,mAngle=m*6;const hx=50+22*Math.sin(hAngle*Math.PI/180),hy=50-22*Math.cos(hAngle*Math.PI/180);const mx=50+34*Math.sin(mAngle*Math.PI/180),my=50-34*Math.cos(mAngle*Math.PI/180);let ticks='';for(let i=0;i<12;i++){const a=i*30*Math.PI/180,x1=50+38*Math.sin(a),y1=50-38*Math.cos(a),x2=50+44*Math.sin(a),y2=50-44*Math.cos(a);ticks+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="1.5"/>`}return `<div class="pics"><div class="pic" style="padding:8px"><svg width="120" height="120" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--ink)" stroke-width="2"/>${ticks}<line x1="50" y1="50" x2="${hx}" y2="${hy}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="50" x2="${mx}" y2="${my}" stroke="var(--coral)" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3" fill="var(--ink)"/></svg></div></div>`};
const GRID2=(rows,cols,shaded)=>{const set=new Set(shaded);let cells='';for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const idx=r*cols+c;cells+=`<div style="width:24px;height:24px;border:1px solid var(--ink);background:${set.has(idx)?'var(--indigo)':'transparent'}"></div>`}return `<div class="pics"><div class="pic" style="display:grid;grid-template-columns:repeat(${cols},24px);padding:8px">${cells}</div></div>`};
const BARS=(labels,values,maxV)=>{const w=46;const bars=values.map((v,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:3px;width:${w}px"><div style="font-size:10px">${v}</div><div style="width:${w-14}px;height:${Math.round(v/maxV*100)}px;background:var(--indigo)"></div><div style="font-size:9px;text-align:center;line-height:1.1">${labels[i]}</div></div>`).join('');return `<div class="pics"><div class="pic" style="display:flex;align-items:flex-end;gap:6px;padding:8px 8px 4px">${bars}</div></div>`};
const RULER=(value,maxV)=>{let ticks='';for(let i=0;i<=maxV;i++){ticks+=`<div style="position:absolute;left:${i/maxV*100}%;top:14px;bottom:0;width:1px;background:var(--ink)"></div><div style="position:absolute;left:${i/maxV*100}%;top:24px;font-size:9px;transform:translateX(-3px)">${i}</div>`}return `<div class="pics"><div class="pic" style="padding:8px"><div style="position:relative;width:260px;height:38px"><div style="position:absolute;left:0;top:0;width:${value/maxV*100}%;height:10px;background:var(--coral);opacity:.8"></div><div style="position:absolute;left:0;right:0;top:14px;height:2px;background:var(--ink)"></div>${ticks}</div></div></div>`};
const LPLOT=(labels,counts)=>{const maxC=Math.max(...counts);const cols=counts.map((c,i)=>{let xs='';for(let k=0;k<c;k++){xs+=`<div style="font-size:12px;line-height:1.1">✕</div>`}return `<div style="display:flex;flex-direction:column-reverse;align-items:center;gap:1px;width:34px"><div style="font-size:9px;margin-top:2px">${labels[i]}</div>${xs}</div>`}).join('');return `<div class="pics"><div class="pic" style="display:flex;align-items:flex-end;gap:2px;padding:8px;border-bottom:2px solid var(--ink)">${cols}</div></div>`};
const PICT=(labels,counts,per)=>{const rows=labels.map((l,i)=>`<div class="f"><b style="width:90px;display:inline-block">${l}</b>${'●'.repeat(counts[i])}</div>`).join('');return `<div class="pics"><div class="pic" style="padding:8px;text-align:left">${rows}<div class="small" style="margin-top:6px">Key: ● = ${per}</div></div></div>`};
const RHOMBUS=(side)=>`<div class="pics"><div class="pic" style="padding:14px"><div style="width:60px;height:60px;background:var(--indigo);transform:rotate(45deg);margin:10px"></div><div class="small" style="text-align:center">side = ${side}</div></div></div>`;
const TRI=(shadedFrac)=>`<div class="pics"><div class="pic" style="padding:8px"><svg width="140" height="100" viewBox="0 0 140 100"><polygon points="70,5 5,95 70,95" fill="${shadedFrac>=1?'var(--indigo)':shadedFrac>0?'var(--indigo)':'transparent'}" stroke="var(--ink)" stroke-width="2"/><polygon points="70,5 135,95 70,95" fill="${shadedFrac>=2?'var(--indigo)':'transparent'}" stroke="var(--ink)" stroke-width="2"/><line x1="70" y1="5" x2="70" y2="95" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4,3"/></svg></div></div>`;
const SQPART=(shaded,total,cols)=>{const rows=Math.ceil(total/cols);let cells='';for(let i=0;i<total;i++){cells+=`<div style="border:1px dashed var(--ink);background:${i<shaded?'var(--indigo)':'transparent'}"></div>`}return `<div class="pics"><div class="pic" style="display:grid;grid-template-columns:repeat(${cols},32px);grid-template-rows:repeat(${rows},32px);padding:8px">${cells}</div></div>`};
const CIRCPART=(shadedList,total)=>{const step=360/total;const grad=Array.from({length:total},(_,i)=>`${shadedList.includes(i)?'var(--indigo)':'transparent'} ${i*step}deg ${(i+1)*step}deg`).join(',');return `<div class="pics"><div class="pic" style="padding:8px"><div style="width:80px;height:80px;border-radius:50%;background:conic-gradient(${grad});border:2px solid var(--ink)"></div></div></div>`};
const L1=[
mc("What time does this clock show?",['3:12','2:17','2:22','2:03'],1,'The hour hand is between 2 and 3, and the minute hand is past 15 but not 20: 2:17.',CLOCK(2,17)),
mc("What time does this clock show?",['5:42','9:28','6:47','5:47'],3,'The hour hand is between 5 and 6, and the minute hand is past 45 but not 50: 5:47.',CLOCK(5,47)),
mc("What time does this clock show?",['10:00','12:50','10:02','9:41'],2,'The hour hand is at 10, and the minute hand is just past 12: 10:02.',CLOCK(10,2)),
mc("What time does this clock show?",['12:39','8:04','1:38','12:42'],0,'The hour hand is just past 12, and the minute hand is past 35 but not 40: 12:39.',CLOCK(12,39)),
mc("On an analog clock, the shorter hand shows the ___.",['minutes','hours','seconds','days'],1,'The shorter hand points to the hour.'),
mc("On an analog clock, the longer hand shows the ___.",['minutes','hours','days','seconds'],0,'The longer hand points to the minutes.'),
mc("The clock currently shows this time. What time will it be in 8 minutes?",['1:38','10:15','10:10','12:58'],2,'The clock shows 10:02. 10:02 + 8 minutes = 10:10.',CLOCK(10,2)),
mc("The clock currently shows this time. What time will it be in 20 minutes?",['12:59','1:09','2:00','8:24'],0,'The clock shows 12:39. 12:39 + 20 minutes = 12:59.',CLOCK(12,39)),
mc("The clock shows this time. What time was it 10 minutes ago?",['1:29','12:29','12:49','1:09'],1,'The clock shows 12:39. 12:39 − 10 minutes = 12:29.',CLOCK(12,39)),
mc("Lucy started her test at 12:09 PM and finished at 12:58 PM. David started at 12:15 PM and ended at 1:03 PM. Who finished in a shorter amount of time?",['Lucy','David','They both took the same amount of time.','There is not enough information given.'],1,"Lucy's time: 49 minutes. David's time: 48 minutes. David was faster."),
mc("The Jamisons are on a road trip that will take 5 hours and 25 minutes. They have been driving for 3 hours and 41 minutes. How much longer do they need to travel before they reach their destination?",['1 hour, 13 minutes','2 hours, 19 minutes','1 hour, 44 minutes','2 hours, 7 minutes'],2,'5h25m = 325 minutes; 3h41m = 221 minutes; 325 − 221 = 104 minutes = 1 hour 44 minutes.'),
mc("Rachel usually gets around 9 hours of sleep per night. She went to bed at 9:30 PM. About what time will she wake up?",['8:30 AM','10:30 AM','6:30 AM','5:30 AM'],2,'9 hours after 9:30 PM is 6:30 AM.'),
mc("A 45 minute long show ends at 12:20 PM. When did the show begin?",['1:05 PM','11:35 AM','11:35 PM','11:45 AM'],1,'Counting back 45 minutes from 12:20 PM gives 11:35 AM.'),
mc("Mrs. James is giving her class a math test. She is allowing the students 40 minutes to finish the test. The test began at 10:22 AM. By what time must the test be finished?",['10:42 AM','10:57 AM','11:02 AM','12:02 PM'],2,'10:22 AM + 40 minutes = 11:02 AM.'),
mc("The directions on a frozen pizza say to cook it for 25 minutes. Mr. Adams puts the frozen pizza in the oven at 5:43 PM. When will the pizza be done?",['6:08 PM','6:18 PM','6:13 PM','5:58 PM'],0,'5:43 PM + 25 minutes = 6:08 PM.'),
{t:'multi',q:"Which statements are true? Select ALL the correct answers.",opts:['The minute hand points to 4','The minute hand points to 6','The hour hand points to 6','The clock shows the time as 5:30'],a:[1,3],exp:'The minute hand points to 6 (30 minutes), and the clock shows 5:30.',pics:CLOCK(5,30)},
{t:'txt',q:"What time does this clock show? Write your answer in the box below.",f:[{l:'Time',a:['1:00']}],show:'The clock shows 1:00.',pics:CLOCK(1,0)},
mc("Circle the clock that shows the time as 12:15",['Clock A','Clock B','Clock C'],0,'Clock A shows 12:15 (hour hand just past 12, minute hand at the 3).',`<div class="pics"><div style="display:flex;gap:10px">${CLOCK(12,15)}${CLOCK(6,42)}${CLOCK(12,0)}</div></div>`),
{t:'self',q:"John starts working in the garden at 5:30 PM and finishes 40 minutes later. What time does the clock show when John finishes his work? Represent this on a number line.",model:'5:30 PM + 40 minutes = 6:10 PM.'},
{t:'sel',q:"The clocks in the first column show different times. For each clock, select the correct answer.",opts:['9:42','11:58','2:03'],rows:[['Clock 1  []','11:58'],['Clock 2  []','2:03'],['Clock 3  []','9:42']],show:'Clock 1 = 11:58, Clock 2 = 2:03, Clock 3 = 9:42.'}
];
const L2=[
mc("Cedric began reading his book at 9:12 AM. He finished at 10:02 AM. How long did it take him to read his book?",['50 minutes','40 minutes','48 minutes','30 minutes'],0,'From 9:12 to 10:02 is 50 minutes.'),
mc("Samantha began eating her dinner at 7:11 PM and finished at 7:35 PM. How long did Samantha take to eat her dinner?",['34 minutes','21 minutes','24 minutes','30 minutes'],2,'From 7:11 to 7:35 is 24 minutes.'),
mc("Tanya has after school tutoring from 3:00 PM until 3:25 PM. She began walking home at 3:31 PM and arrived at her house at 3:56 PM. How long did it take Tanya to walk home?",['31 minutes','15 minutes','56 minutes','25 minutes'],3,'From 3:31 to 3:56 is 25 minutes.'),
mc("Doug loves to play video games. He started playing at 4:00 PM and did not finish until 5:27 PM. How long did Doug play video games?",['1 hour and 37 minutes','1 hour and 27 minutes','27 minutes','2 hours and 27 minutes'],1,'From 4:00 to 5:27 is 1 hour and 27 minutes.'),
mc("Kelly has to clean her room before going to bed. She began cleaning her room at 6:12 PM. When she finished, it was 7:15 PM. How long did it take Kelly to clean her room?",['57 minutes','53 minutes','1 hour and 3 minutes','1 hour and 15 minutes'],2,'From 6:12 to 7:15 is 1 hour and 3 minutes.'),
mc("Holly had a busy day. She attended a play from 7:06 PM until 8:13 PM. Then she went to dinner from 8:30 to 9:30 PM. How long did Holly attend the play?",['57 minutes','2 hours and 27 minutes','46 minutes','1 hour and 7 minutes'],3,'From 7:06 to 8:13 is 1 hour and 7 minutes.'),
mc("Cara took her little brother to the park. They arrived at 3:11 PM and played until 4:37 PM. How long did Cara and her brother play at the park?",['26 minutes','1 hour and 26 minutes','56 minutes','1 hour and 37 minutes'],1,'From 3:11 to 4:37 is 1 hour and 26 minutes.'),
mc("Arthur ran 5 miles. He began running at 8:19 AM and finished at 9:03 AM. How long did it take Arthur to run 5 miles?",['44 minutes','45 minutes','40 minutes','54 minutes'],0,'From 8:19 to 9:03 is 44 minutes.'),
mc("Mr. Daniels wanted to see how fast he could wash the dishes. He began washing at 4:17 PM and finished at 4:32 PM. How long did it take Mr. Daniels to wash the dishes?",['15 minutes','25 minutes','27 minutes','32 minutes'],0,'From 4:17 to 4:32 is 15 minutes.'),
mc("Sophia took a test that started at 3:28 PM. She finished the test at 4:11 PM. How long did it take Sophia to take her test?",['37 minutes','47 minutes','33 minutes','43 minutes'],3,'From 3:28 to 4:11 is 43 minutes.'),
mc("Jonathan loves riding his bike, but he has to leave for football practice at 1:30 PM. If it is 1:11 PM now, how long does Jonathan have left to ride his bike before he has to leave for practice?",['9 minutes','19 minutes','21 minutes','29 minutes'],1,'From 1:11 to 1:30 is 19 minutes.'),
mc("Mrs. Roberts loves to take a 20-minute nap on Saturdays. She was really tired when she went to sleep at 10:45 AM. She did not wake up until 11:25 AM. How long was Mrs. Roberts' long nap?",['40 minutes','20 minutes','60 minutes','30 minutes'],0,'From 10:45 to 11:25 is 40 minutes.'),
mc("Spencer has to be at his piano lesson at noon. If it is now 11:29 AM, how long does Spencer have to get to his lesson?",['31 minutes','1 minute','29 minutes','39 minutes'],0,'From 11:29 AM to 12:00 noon is 31 minutes.'),
mc("Look at the clocks below. How much time has elapsed between Clock A to Clock B?",['1 hour and 2 minutes','1 hour and 12 minutes','52 minutes','42 minutes'],0,'Clock A shows 12:01 and Clock B shows 1:03. Elapsed time is 1 hour and 2 minutes.',`<div class="pics"><div style="display:flex;gap:10px">${CLOCK(12,1)}${CLOCK(1,3)}</div></div>`),

mc("The city is building a fence around a park. The park is 20 feet by 50 feet. How many feet of fencing do they need?",['100 feet','120 feet','140 feet','70 feet'],2,'20+50+20+50 = 140 feet.'),
mc("Find the perimeter of the following rectangle. (33 inches by 53 inches)",['86 inches','172 inches','1,749 inches','50 inches'],1,'33+53+33+53 = 172 inches.',RECTPIC('53 inches','33 inches')),
mc("Find the perimeter of the following rectangle. (5 meters by 10 meters)",['15 meters','25 meters','30 meters','50 meters'],2,'5+10+5+10 = 30 meters.',RECTPIC('10 meters','5 meters')),
mc("The perimeter of the following object is 16 feet. Find the length of the missing side. (a rectangle 3 feet on one side, unknown x on the adjacent side)",['x = 5 feet','x = 10 feet','x = 13 feet','x = 6 feet'],0,'2(3) + 2x = 16, so 2x = 10, x = 5 feet.',RECTPIC('x','3 feet')),
mc("The perimeter of the following object is 20 feet. Find the length of the missing side. (a square-like shape 7 feet on one side, unknown x)",['x = 3 feet','x = 6 feet','x = 13 feet','x = 7 feet'],0,'2(7) + 2x = 20, so 2x = 6, x = 3 feet.',RECTPIC('x','7 feet')),
mc("The city is building a fence around a park. The park is 20 feet by 50 feet. If they only want the fence on 3 sides, what is the least amount of fencing they could buy?",['140 feet','100 feet','120 feet','90 feet'],3,'Fence the two 20-ft sides and one 50-ft side: 20+20+50 = 90 feet.'),
mc("The perimeter of the following object is 38 feet. Find the length of the missing side. (a square-like shape 12 feet on one side, unknown x)",['x = 17 feet','x = 12 feet','x = 7 feet','x = 26 feet'],2,'2(12) + 2x = 38, so 2x = 14, x = 7 feet.',RECTPIC('x','12 feet')),
mc("The perimeter of the following object is 24 inches. Find the length of the missing side. (5 inches on one side, unknown x)",['x = 19 inches','x = 7 inches','x = 9 inches','x = 12 inches'],1,'2(5) + 2x = 24, so 2x = 14, x = 7 inches.',RECTPIC('x','5 inches')),
mc("The perimeter of the following object is 54 yards. Find the length of the missing side. (13 yards on one side, unknown x)",['x = 28 yards','x = 14 yards','x = 41 yards','x = 27 yards'],1,'2(13) + 2x = 54, so 2x = 28, x = 14 yards.',RECTPIC('x','13 yards')),
{t:'multi',q:"Which of the following statements are true? Select ALL correct answers.",opts:['The perimeter is the distance around the outside of a plane figure.','The perimeter is the center of a circle.','The perimeter can be found by adding the angles of a triangle.',"The perimeter can be found by adding the length of a figure's sides."],a:[0,3],exp:'The perimeter is the distance around a shape, found by adding the lengths of its sides.'},
{t:'txt',q:"What is the perimeter of the rectangle shown below? (6 units by 3 units)",f:[{l:'Perimeter',a:['18']}],show:'6+3+6+3 = 18 units.'},
mc("Circle the rhombus that has a perimeter of 8.0 cm.",['2 cm sides','5 cm sides','4 cm sides'],0,'4 × 2 = 8 cm.',`<div class="pics"><div style="display:flex;gap:14px">${RHOMBUS(2)}${RHOMBUS(5)}${RHOMBUS(4)}</div></div>`),
{t:'self',q:"John draws a regular hexagon. Each side measures 8 centimeters. He also draws a regular octagon. Each side of the octagon measures 7 centimeters. Which shape has a greater perimeter? How did you arrive at the answer?",model:'Hexagon perimeter = 6 × 8 = 48 cm. Octagon perimeter = 8 × 7 = 56 cm. 56 > 48, so the octagon has the greater perimeter.'},
{t:'grid',q:"The perimeters of the rectangles are given in the first column. For each perimeter, select the possible areas of the rectangles (assume whole-number sides). More than one option may be correct.",cols:['15 sq. cm.','10 sq. cm.','12 sq. cm.'],rows:[['Perimeter = 16 cm',[0,2]],['Perimeter = 14 cm',[1,2]],['Perimeter = 22 cm',[1]]],show:'Perimeter 16 (sum of sides=8): 2×6=12 or 3×5=15. Perimeter 14 (sum=7): 2×5=10 or 3×4=12. Perimeter 22 (sum=11): 1×10=10.'}
];
const LES=[
{name:'Lesson 1: Telling Time',qs:L1},
{name:'Lesson 2: Elapsed Time',qs:L2},
{name:'Lesson 3: Liquid Volume &amp; Mass',qs:L3},
{name:'Lesson 4: Graph',qs:L4},
{name:'Lesson 5: Measuring Length',qs:L5},
{name:'Lesson 6: Area',qs:L6},
{name:'Lesson 7: Relating Area to Addition &amp; Multiplication',qs:L7},
{name:'Lesson 8: Perimeter',qs:L8}
];
const LT=['Ⓐ','Ⓑ','Ⓒ','Ⓓ'];
let timerInt=null;
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null}}
function startTimer(){stopTimer();let t=300;const tick=()=>{const node=$('timer');if(!node){stopTimer();return}const m=Math.floor(t/60),sec=t%60;node.textContent=m+':'+(sec<10?'0':'')+sec;node.style.color=t<=60?'var(--coral)':'var(--indigo)';if(t<=0){stopTimer();return}t--};tick();timerInt=setInterval(tick,1000)}
let lesson=null,i=0,score=0,miss=[],res=[],lastGiven='';
const picked=new Set();
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const correctText=q=>q.t==='mc'?LT[q.a]+' '+q.opts[q.a]:q.t==='multi'?q.a.map(j=>LT[j]+' '+q.opts[j]).join('; '):q.t==='self'?q.model:(q.show||'');
const norm=s=>s.toLowerCase().replace(/\s+/g,'').replace(/[×*]/g,'x');
function home(){stopTimer();lesson=null;$('sub').textContent='Pick a lesson to practice';
 $('st').innerHTML=`<div class="list">${LES.map((l,k)=>`<button class="les" onclick="start(${k})"><span>${l.name}</span><small>${l.qs.length} questions</small></button>`).join('')}</div>`}
function start(k){lesson=k;i=0;score=0;miss=[];res=[];lastGiven='';picked.clear();show()}
function next(ok){res.push({ok,given:lastGiven});lastGiven='';if(ok)score++;else miss.push(i+1);i++;show()}
function show(){
 if(lesson===null){home();return}
 const L=LES[lesson],Q=L.qs,s=$('st');
 $('sub').innerHTML=L.name;
 if(i>=Q.length){
  stopTimer();
  const pct=Math.round(score/Q.length*100);
  const rows=Q.map((q,k)=>{const r=res[k]||{ok:false,given:''};return `<div class="ri ${r.ok?'okr':'nor'}"><div class="rh"><span class="mk">${r.ok?'✓':'✗'}</span> Question ${k+1}</div><div class="rq">${esc(q.q.replace(/\n/g,' ').slice(0,110))}${q.q.length>110?'…':''}</div><div class="ra"><b>Your answer:</b> ${esc(r.given||'(no answer)')}</div>${r.ok?'':`<div class="rc"><b>Correct answer:</b> ${esc(correctText(q))}</div>`}</div>`}).join('');
  s.innerHTML=`<div class="c"><div class="score">${score}/${Q.length}</div><p><b>Test score: ${pct}%</b><br>${score} correct · ${Q.length-score} wrong</p><p class="small">${L.name}</p><button class="nb" onclick="start(lesson)">Try again</button>${lesson<LES.length-1?`<button class="nb alt" onclick="start(${lesson+1})">Next lesson →</button>`:''}<button class="nb ghost" onclick="home()">All lessons</button></div><h3 class="revh">Review of your answers</h3><div class="rev">${rows}</div>`;return}
 const q=Q[i];
 let h=`<button class="back" onclick="home()">← All lessons</button><div class="track"><div class="fill" style="width:${i/Q.length*100}%"></div></div><div class="qn">QUESTION ${i+1} OF ${Q.length}<span class="timer" id="timer" style="float:right;font-weight:700;color:var(--indigo)">5:00</span></div><p class="qt">${q.q}</p>${q.pics||''}`;
 if(q.t==='mc')h+=`<div class="opts">${q.opts.map((o,j)=>`<button class="opt" id="m${j}" onclick="selectMC(${j})"><b class="lt" id="lt${j}">${LT[j]}</b><span>${o}</span></button>`).join('')}</div><button class="nb" id="chk" onclick="confirmMC()" disabled>OK</button>`;
 if(q.t==='multi')h+=`<div class="opts">${q.opts.map((o,j)=>`<button class="opt" id="m${j}" onclick="tog(${j})"><b class="lt" id="lt${j}">☐ ${LT[j]}</b><span>${o}</span></button>`).join('')}</div><button class="nb" id="chk" onclick="chkMulti()">Check</button>`;
 if(q.t==='txt')h+=q.f.map((f,j)=>`<div class="f">${f.l.startsWith('<')?f.l:`<b>${f.l}:</b>`}<input type="text" id="in${j}" autocomplete="off"></div>`).join('')+`<button class="nb" id="chk" onclick="chkTxt()">Check</button>`;
 if(q.t==='sel')h+=q.rows.map((r,j)=>`<div class="f">${r[0].replace('[]',`<select id="s${j}"><option value="">?</option>${q.opts.map(o=>`<option>${o}</option>`).join('')}</select>`)}</div>`).join('')+`<button class="nb" id="chk" onclick="chkSel()">Check</button>`;
 if(q.t==='grid')h+=`<table><tr><th></th>${q.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${q.rows.map((r,k)=>`<tr><td style="text-align:left">${r[0]}</td>${q.cols.map((c,j)=>`<td><input type="checkbox" id="g${k}_${j}"></td>`).join('')}</tr>`).join('')}</table><button class="nb" id="chk" onclick="chkGrid()">Check</button>`;
 if(q.t==='self')h+=`<textarea id="ta" placeholder="Write your answer here..."></textarea><button class="nb" id="chk" onclick="showModel()">Show model answer</button>`;
 s.innerHTML=h+'<div id="fb"></div>';
 startTimer();
}
function fin(ok,msg){$('fb').innerHTML=`<div class="fb ${ok?'good':'bad'}">${ok?'Nice work! ':'Not quite — '}${msg}</div><button class="nb alt" onclick="next(${ok})">Next</button>`;const c=$('chk');if(c)c.disabled=true}
const cur=()=>LES[lesson].qs[i];
let selMC=null;
function selectMC(j){selMC=j;document.querySelectorAll('.opts .opt').forEach((o,k)=>o.classList.toggle('sel',k===j));$('chk').disabled=false}
function confirmMC(){if(selMC===null)return;const q=cur(),j=selMC;lastGiven=LT[j]+' '+q.opts[j];document.querySelectorAll('.opts .opt').forEach((o,k)=>{o.disabled=true;o.classList.remove('sel');if(k===q.a)o.classList.add('ok');else if(k===j)o.classList.add('no')});selMC=null;fin(j===q.a,q.exp)}
function tog(j){const b=$('m'+j);if(picked.has(j)){picked.delete(j);b.classList.remove('sel')}else{picked.add(j);b.classList.add('sel')}$('lt'+j).textContent=(picked.has(j)?'☑ ':'☐ ')+LT[j]}
function chkMulti(){const q=cur();const ok=picked.size===q.a.length&&q.a.every(x=>picked.has(x));lastGiven=[...picked].sort().map(j=>LT[j]+' '+q.opts[j]).join('; ')||'(none selected)';picked.clear();fin(ok,q.exp)}
function chkTxt(){const q=cur();lastGiven=q.f.map((f,j)=>{const v=($('in'+j).value||'').trim()||'—';return q.f.length>1?(f.l.startsWith('<')?'('+(j+1)+') ':f.l.replace(/<[^>]*>/g,'')+': ')+v:v}).join('; ');fin(q.f.every((f,j)=>{const v=norm($('in'+j).value);return f.a.includes(v)||(f.has&&v.includes(f.has))}),q.show)}
function chkSel(){const q=cur();lastGiven=q.rows.map((r,j)=>(j+1)+') '+($('s'+j).value||'—')).join('; ');fin(q.rows.every((r,j)=>$('s'+j).value===r[1]),q.show)}
function chkGrid(){const q=cur();lastGiven=q.rows.map((r,k)=>(k+1)+') '+(q.cols.filter((c,j)=>$('g'+k+'_'+j).checked).join(', ')||'—')).join('; ');const ok=q.rows.every((r,k)=>q.cols.every((c,j)=>$('g'+k+'_'+j).checked===r[1].includes(j)));fin(ok,q.show)}
function showModel(){const q=cur();lastGiven=($('ta').value||'').trim()||'(nothing written)';$('fb').innerHTML=`<div class="model"><b>Model answer:</b> ${q.model}</div><p class="small">Did your answer match?</p><div class="row"><button class="pill" onclick="next(true)">I got it ✅</button><button class="pill" onclick="next(false)">Not yet</button></div>`;$('chk').disabled=true}
home();
</script></body></html>
