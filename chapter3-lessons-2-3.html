<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chapter 3 Number &amp; Operations - Fractions</title>
<style>
:root{--bg:#FBF7EC;--ink:#26304A;--card:#fff;--line:#E4DCC9;--indigo:#2B3A67;--coral:#FF6B4A;--teal:#2A9D8F;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root{--bg:#1D2233;--ink:#F1ECDD;--card:#262B40;--line:#3A4159;--indigo:#F4C95D}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:21px;margin:0 0 2px;color:var(--indigo);line-height:1.25}.sub{font-size:14px;opacity:.7;margin:0 0 14px}
.row{display:flex;gap:8px;margin-bottom:10px}
button{font:inherit;cursor:pointer}
.pill{flex:1;padding:12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.les{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600}
.les small{font-weight:400;opacity:.65;font-size:13px}
.les:active{transform:scale(.99)}
.back{background:none;border:none;color:var(--indigo);font-weight:600;font-size:14px;padding:0 0 10px;cursor:pointer}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:12px}
.track{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:14px}
.fill{height:100%;background:var(--teal);transition:width .3s}
.qn{font-size:12px;font-weight:700;color:var(--coral);margin-bottom:6px}
.qt{font-size:17px;font-weight:600;line-height:1.45;margin:0 0 12px;white-space:pre-line}
.pics{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pic{padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:20px;line-height:1.3}
.pic b{display:block;font-size:13px;font-family:system-ui;margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px}
.lt{font-size:18px;min-width:26px;white-space:nowrap}
.opt.sel{border-color:var(--indigo);background:rgba(128,128,128,.14)}
.opt.ok{border-color:var(--teal);background:rgba(42,157,143,.16)}.opt.no{border-color:var(--coral);background:rgba(255,107,74,.16)}
input[type=text],select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]{width:140px}textarea{font:inherit;font-size:15px;width:100%;min-height:90px;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.f{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap;font-size:16px}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:8px 6px;text-align:center}
.nb{margin-top:14px;width:100%;padding:13px;border:none;border-radius:12px;background:var(--indigo);color:#fff;font-weight:700;font-size:15px}
@media(prefers-color-scheme:dark){.nb{color:#1D2233}}
.nb.alt{background:var(--teal);color:#fff}.nb:disabled{opacity:.4}
.nb.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.fb{margin-top:12px;font-weight:600;font-size:14.5px;line-height:1.45}.good{color:var(--teal)}.bad{color:var(--coral)}
.model{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line);font-size:14.5px;line-height:1.5}
.revh{margin:22px 0 8px;font-size:16px;color:var(--indigo)}.rev{text-align:left}.ri{border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.45}.ri.nor{border-left-color:var(--coral)}.rh{font-weight:700}.mk{font-size:18px;font-weight:800}.okr .mk{color:var(--teal)}.nor .mk{color:var(--coral)}.rq{opacity:.7;margin:2px 0 4px}.rc{color:var(--teal)}
.score{font-size:46px;font-weight:800;color:var(--indigo);text-align:center}.c{text-align:center}.small{font-size:13px;opacity:.7}
</style></head><body><div class="wrap">
<h1>Chapter 3 Number &amp; Operations - Fractions</h1><p class="sub" id="sub">Lesson 2: Fractions on the Number Line &middot; Lesson 3: Comparing Fractions</p>
<div class="stage" id="st"></div>
</div>
<script>
const mc=(q,opts,a,exp,pics)=>({t:'mc',q,opts,a,exp,pics});
const G=(r,c,s)=>`<div class="pics"><div class="pic" style="display:grid;grid-template-columns:repeat(${c},auto);gap:2px 6px;justify-content:start">${Array(r*c).fill(`<span>${s}</span>`).join('')}</div></div>`;
const RECT=(n,sh)=>{let b='';for(let i=0;i<n;i++){b+=`<div style="width:26px;height:40px;border:1px solid var(--ink);background:${i<sh?'var(--indigo)':'transparent'}"></div>`}return `<div class="pics"><div class="pic" style="display:flex;gap:2px;padding:8px">${b}</div></div>`};
const CIRC=(n,sh)=>{const pct=(sh/n*100).toFixed(2);return `<div class="pics"><div class="pic" style="padding:8px"><div style="width:76px;height:76px;border-radius:50%;background:conic-gradient(var(--indigo) 0% ${pct}%, transparent ${pct}% 100%);border:2px solid var(--ink)"></div></div></div>`};
const STACK=(n)=>{let b='';for(let i=0;i<n;i++){b+=`<div style="width:60px;height:16px;border:1px solid var(--ink);background:var(--indigo);margin-bottom:2px;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center">10</div>`}return `<div class="pics"><div class="pic" style="padding:6px">${b}</div></div>`};
const NL=(n,k)=>{let ticks='';for(let t=0;t<=n;t++){ticks+=`<div style="position:absolute;left:calc(10px + (100% - 20px) * ${t} / ${n});top:22px;bottom:8px;width:1px;background:var(--ink);opacity:.5"></div>`}return `<div class="pics"><div class="pic" style="position:relative;height:46px;width:260px"><div style="position:absolute;left:10px;right:10px;top:26px;height:2px;background:var(--ink)"></div>${ticks}<div style="position:absolute;left:calc(10px + (100% - 20px) * ${k} / ${n});top:20px;width:12px;height:12px;border-radius:50%;background:var(--coral);transform:translateX(-6px)"></div><span style="position:absolute;left:6px;top:30px;font-size:11px">0</span><span style="position:absolute;right:6px;top:30px;font-size:11px">1</span></div></div>`};
const L5=[
mc("What fraction does the number line show?",['1/4','1/3','3/4','4/4'],0,'The line is divided into 4 segments; the dot is at the 1st: 1/4.',NL(4,1)),
mc("What fraction does the number line show?",['1/2','2/2','1/3','2/3'],0,'The line is divided into 2 segments; the dot is at the 1st: 1/2.',NL(2,1)),
mc("What fraction does the number line show?",['2/8','3/5','3/8','4/8'],2,'The line is divided into 8 segments; the dot is at the 3rd: 3/8.',NL(8,3)),
mc("What fraction does the number line show?",['3/8','6/8','5/8','4/8'],1,'The line is divided into 8 segments; the dot is at the 6th: 6/8.',NL(8,6)),
mc("What fraction does the number line show?",['1/6','4/6','3/6','1/5'],0,'The line is divided into 6 segments; the dot is at the 1st: 1/6.',NL(6,1)),
mc("What fraction does the number line show?",['2/4','2/3','1/3','1/4'],2,'The line is divided into 3 segments; the dot is at the 1st: 1/3.',NL(3,1)),
mc("What fraction does the number line show?",['1/6','3/6','2/4','2/6'],3,'The line is divided into 6 segments; the dot is at the 2nd: 2/6.',NL(6,2)),
mc("What fraction does the number line show?",['4/8','5/8','4/4','2/8'],0,'The line is divided into 8 segments; the dot is at the 4th: 4/8.',NL(8,4)),
mc("What fraction does the number line show?",['2/8','2/9','1/9','1/8'],3,'The line is divided into 8 segments; the dot is at the 1st: 1/8.',NL(8,1)),
mc("What fraction does the number line show?",['4/6','5/6','3/6','1/6'],1,'The line is divided into 6 segments; the dot is at the 5th: 5/6.',NL(6,5)),
mc("What fraction does the number line show?",['2/3','1/3','3/3','4/3'],0,'The line is divided into 3 segments; the dot is at the 2nd: 2/3.',NL(3,2)),
mc("What fraction does the number line show?",['1/4','2/4','3/4','4/4'],1,'The line is divided into 4 segments; the dot is at the 2nd: 2/4.',NL(4,2)),
mc("What fraction does the number line show?",['8/9','7/8','2/8','5/9'],1,'The line is divided into 8 segments; the dot is at the 7th: 7/8.',NL(8,7)),
mc("What fraction does the number line show?",['1/4','3/3','2/4','3/4'],3,'The line is divided into 4 segments; the dot is at the 3rd: 3/4.',NL(4,3)),
mc("What fraction does the number line show?",['7/8','6/8','5/8','5/3'],2,'The line is divided into 8 segments; the dot is at the 5th: 5/8.',NL(8,5)),
{t:'multi',q:"Which fractions does the number line show? Select ALL correct answers.",opts:['3/6','1/4','4/8','1/2'],a:[0,2,3],exp:'The line is divided into 8 segments with the dot at the 4th — 4/8, which is equivalent to 1/2, and also to 3/6 for a line divided into 6 segments.',pics:NL(8,4)},
{t:'txt',q:"Type in the number that completes the table if the pattern shows the fraction below.",f:[{l:'Number line divided into 6 segments, dot at the 4th',a:['4/6']}],show:'4/6.',pics:NL(6,4)},
{t:'self',q:"Draw a number line and locate the fraction 5/7 on it.",model:'Divide the line from 0 to 1 into 7 equal segments and place a dot at the 5th mark from 0.',pics:NL(7,5)},
{t:'sel',q:"There are 3 number lines. Which fraction is represented by the dot on each?",opts:['4/4','8/9','5/8'],rows:[['Number line 1 (9 segments, dot at 8th)  []','8/9'],['Number line 2 (8 segments, dot at 5th)  []','5/8'],['Number line 3 (4 segments, dot at 4th)  []','4/4']],show:'Line 1: 8/9. Line 2: 5/8. Line 3: 4/4.'}
];
const L6=[
mc("Which of these sets has the fractions listed from least to greatest?",['1/6, 1/4, 1/3, 1/2','1/2, 1/3, 1/6, 1/4','1/3, 1/4, 1/2, 1/6','1/2, 1/3, 1/4, 1/6'],0,'With the same numerator, a greater denominator means a smaller fraction, so listing denominators from greatest to least (6,4,3,2) goes from least to greatest fraction.'),
mc("Which of these fractions would be found between 1/2 and 1 on a number line?",['1/4','1/3','5/8','3/1'],2,'5/8 is greater than 1/2 (=4/8) and less than 1.'),
mc("Which of these fractions would be found between 0 and 1/2 on a number line?",['7/8','3/4','1/4','5/8'],2,'1/4 is the only choice less than 1/2.'),
mc("Which of these fractions would be found between 0 and 3/4 on a number line?",['7/8','4/8','5/6','4/4'],1,'4/8 (=1/2) is less than 3/4 — the only choice that fits.'),
mc("Which of these fractions is less than 6/8?",['1/8','7/8','9/8','8/8'],0,'1/8 is the only one less than 6/8.'),
mc("Answer the following: 1/2 > ______?",['1/4','2/3','4/8','2/2'],0,'1/2 is greater than 1/4 — the others are equal to or greater than 1/2.'),
mc("Which is greater: 4/8 or 1/2?",['1/2','4/8','They are equal.','There is not enough information given.'],2,'4/8 simplifies to 1/2, so they are equal.'),
mc("Which fraction is less: 1/4 or 1/8?",['1/4','1/8','They are equal.','There is not enough information given.'],1,'Same numerator, so the greater denominator (8) makes the smaller fraction.'),
mc("Which fraction is less: 4/6 or 1/6?",['4/6','1/6','They are equal.','There is not enough information given.'],1,'Same denominator, so compare numerators — 1 is less than 4.'),
mc("If two fractions have the same denominator, the one with a(n) ______ numerator is the greater fraction.",['smaller','greater','even','zero'],1,'With equal denominators, the greater numerator makes the greater fraction.'),
mc("Complete this number sentence: 4/6 ___ 5/6",['>','<','=','There is not enough information given.'],1,'Same denominator, and 4 is less than 5.'),
mc("Complete this number sentence: 3/8 ___ 5/8",['>','<','=','There is not enough information given.'],1,'Same denominator, and 3 is less than 5.'),
mc("Complete this number sentence: 2/4 ___ 1/2",['>','<','=','There is not enough information given.'],2,'2/4 simplifies to 1/2, so they are equal.'),
mc("Complete this number sentence: 1/2 ___ 1/3",['>','<','=','There is not enough information given.'],0,'Same numerator, and 1/2 has a smaller denominator, making it the greater fraction.'),
mc("To compare fractions with the same numerator, you need to look at the ______.",['numerators','denominators','factors of the numerator','multiples of the denominator'],1,'With equal numerators, compare the denominators.'),
{t:'sel',q:"Are the following fractions less than 3/4? Select Yes or No.",opts:['Yes','No'],rows:[['1/4  []','Yes'],['4/4  []','No'],['2/4  []','Yes']],show:'1/4 < 3/4 (yes). 4/4 > 3/4 (no). 2/4 < 3/4 (yes).'},
{t:'sel',q:"Is Fraction #1 less than, greater than, or equal to Fraction #2? Select the correct symbol for each row.",opts:['<','=','>'],rows:[['2/3 vs 1/3  []','>'],['4/6 vs 5/6  []','<'],['8/8 vs 5/5  []','='],['3/4 vs 1/4  []','>']],show:'2/3 > 1/3. 4/6 < 5/6. 8/8 = 5/5 (both equal 1). 3/4 > 1/4.'},
{t:'multi',q:"Which of the following fractions are greater than 2/5? Select ALL correct answers.",opts:['1/5','3/5','4/5','2/5'],a:[1,2],exp:'3/5 and 4/5 are both greater than 2/5.'},
mc("Which of these fractions is greater than 5/7? Circle the correct answer.",['1/7','2/7','4/7','6/7'],3,'6/7 is the only one greater than 5/7.'),
{t:'txt',q:"Which of the following fractions is the least?\n6/5, 6/4, 6/10, 6/9",f:[{l:'Answer',a:['6/10']}],show:'With the same numerator, the greatest denominator (10) gives the smallest fraction: 6/10.'}
];
const LES=[
{name:'Lesson 2: Fractions on the Number Line',qs:L5},
{name:'Lesson 3: Comparing Fractions',qs:L6}
];
const LT=['Ⓐ','Ⓑ','Ⓒ','Ⓓ'];
let lesson=null,i=0,score=0,miss=[],res=[],lastGiven='';
const picked=new Set();
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const correctText=q=>q.t==='mc'?LT[q.a]+' '+q.opts[q.a]:q.t==='multi'?q.a.map(j=>LT[j]+' '+q.opts[j]).join('; '):q.t==='self'?q.model:(q.show||'');
const norm=s=>s.toLowerCase().replace(/\s+/g,'').replace(/[×*]/g,'x');
function home(){lesson=null;$('sub').textContent='Pick a lesson to practice';
 $('st').innerHTML=`<div class="list">${LES.map((l,k)=>`<button class="les" onclick="start(${k})"><span>${l.name}</span><small>${l.qs.length} questions</small></button>`).join('')}</div>`}
function start(k){lesson=k;i=0;score=0;miss=[];res=[];lastGiven='';picked.clear();show()}
function next(ok){res.push({ok,given:lastGiven});lastGiven='';if(ok)score++;else miss.push(i+1);i++;show()}
function show(){
 if(lesson===null){home();return}
 const L=LES[lesson],Q=L.qs,s=$('st');
 $('sub').innerHTML=L.name;
 if(i>=Q.length){
  const pct=Math.round(score/Q.length*100);
  const rows=Q.map((q,k)=>{const r=res[k]||{ok:false,given:''};return `<div class="ri ${r.ok?'okr':'nor'}"><div class="rh"><span class="mk">${r.ok?'✓':'✗'}</span> Question ${k+1}</div><div class="rq">${esc(q.q.replace(/\n/g,' ').slice(0,110))}${q.q.length>110?'…':''}</div><div class="ra"><b>Your answer:</b> ${esc(r.given||'(no answer)')}</div>${r.ok?'':`<div class="rc"><b>Correct answer:</b> ${esc(correctText(q))}</div>`}</div>`}).join('');
  s.innerHTML=`<div class="c"><div class="score">${score}/${Q.length}</div><p><b>Test score: ${pct}%</b><br>${score} correct · ${Q.length-score} wrong</p><p class="small">${L.name}</p><button class="nb" onclick="start(lesson)">Try again</button>${lesson<LES.length-1?`<button class="nb alt" onclick="start(${lesson+1})">Next lesson →</button>`:''}<button class="nb ghost" onclick="home()">All lessons</button></div><h3 class="revh">Review of your answers</h3><div class="rev">${rows}</div>`;return}
 const q=Q[i];
 let h=`<button class="back" onclick="home()">← All lessons</button><div class="track"><div class="fill" style="width:${i/Q.length*100}%"></div></div><div class="qn">QUESTION ${i+1} OF ${Q.length}</div><p class="qt">${q.q}</p>${q.pics||''}`;
 if(q.t==='mc')h+=`<div class="opts">${q.opts.map((o,j)=>`<button class="opt" id="m${j}" onclick="selectMC(${j})"><b class="lt" id="lt${j}">${LT[j]}</b><span>${o}</span></button>`).join('')}</div><button class="nb" id="chk" onclick="confirmMC()" disabled>OK</button>`;
 if(q.t==='multi')h+=`<div class="opts">${q.opts.map((o,j)=>`<button class="opt" id="m${j}" onclick="tog(${j})"><b class="lt" id="lt${j}">☐ ${LT[j]}</b><span>${o}</span></button>`).join('')}</div><button class="nb" id="chk" onclick="chkMulti()">Check</button>`;
 if(q.t==='txt')h+=q.f.map((f,j)=>`<div class="f">${f.l.startsWith('<')?f.l:`<b>${f.l}:</b>`}<input type="text" id="in${j}" autocomplete="off"></div>`).join('')+`<button class="nb" id="chk" onclick="chkTxt()">Check</button>`;
 if(q.t==='sel')h+=q.rows.map((r,j)=>`<div class="f">${r[0].replace('[]',`<select id="s${j}"><option value="">?</option>${q.opts.map(o=>`<option>${o}</option>`).join('')}</select>`)}</div>`).join('')+`<button class="nb" id="chk" onclick="chkSel()">Check</button>`;
 if(q.t==='grid')h+=`<table><tr><th></th>${q.cols.map(c=>`<th>${c}</th>`).join('')}</tr>${q.rows.map((r,k)=>`<tr><td style="text-align:left">${r[0]}</td>${q.cols.map((c,j)=>`<td><input type="checkbox" id="g${k}_${j}"></td>`).join('')}</tr>`).join('')}</table><button class="nb" id="chk" onclick="chkGrid()">Check</button>`;
 if(q.t==='self')h+=`<textarea id="ta" placeholder="Write your answer here..."></textarea><button class="nb" id="chk" onclick="showModel()">Show model answer</button>`;
 s.innerHTML=h+'<div id="fb"></div>';
}
function fin(ok,msg){$('fb').innerHTML=`<div class="fb ${ok?'good':'bad'}">${ok?'Nice work! ':'Not quite — '}${msg}</div><button class="nb alt" onclick="next(${ok})">Next</button>`;const c=$('chk');if(c)c.disabled=true}
const cur=()=>LES[lesson].qs[i];
let selMC=null;
function selectMC(j){selMC=j;document.querySelectorAll('.opts .opt').forEach((o,k)=>o.classList.toggle('sel',k===j));$('chk').disabled=false}
function confirmMC(){if(selMC===null)return;const q=cur(),j=selMC;lastGiven=LT[j]+' '+q.opts[j];document.querySelectorAll('.opts .opt').forEach((o,k)=>{o.disabled=true;o.classList.remove('sel');if(k===q.a)o.classList.add('ok');else if(k===j)o.classList.add('no')});selMC=null;fin(j===q.a,q.exp)}
function tog(j){const b=$('m'+j);if(picked.has(j)){picked.delete(j);b.classList.remove('sel')}else{picked.add(j);b.classList.add('sel')}$('lt'+j).textContent=(picked.has(j)?'☑ ':'☐ ')+LT[j]}
function chkMulti(){const q=cur();const ok=picked.size===q.a.length&&q.a.every(x=>picked.has(x));lastGiven=[...picked].sort().map(j=>LT[j]+' '+q.opts[j]).join('; ')||'(none selected)';picked.clear();fin(ok,q.exp)}
function chkTxt(){const q=cur();lastGiven=q.f.map((f,j)=>{const v=($('in'+j).value||'').trim()||'—';return q.f.length>1?(f.l.startsWith('<')?'('+(j+1)+') ':f.l.replace(/<[^>]*>/g,'')+': ')+v:v}).join('; ');fin(q.f.every((f,j)=>{const v=norm($('in'+j).value);return f.a.includes(v)||(f.has&&v.includes(f.has))}),q.show)}
function chkSel(){const q=cur();lastGiven=q.rows.map((r,j)=>(j+1)+') '+($('s'+j).value||'—')).join('; ');fin(q.rows.every((r,j)=>$('s'+j).value===r[1]),q.show)}
function chkGrid(){const q=cur();lastGiven=q.rows.map((r,k)=>(k+1)+') '+(q.cols.filter((c,j)=>$('g'+k+'_'+j).checked).join(', ')||'—')).join('; ');const ok=q.rows.every((r,k)=>q.cols.every((c,j)=>$('g'+k+'_'+j).checked===r[1].includes(j)));fin(ok,q.show)}
function showModel(){const q=cur();lastGiven=($('ta').value||'').trim()||'(nothing written)';$('fb').innerHTML=`<div class="model"><b>Model answer:</b> ${q.model}</div><p class="small">Did your answer match?</p><div class="row"><button class="pill" onclick="next(true)">I got it ✅</button><button class="pill" onclick="next(false)">Not yet</button></div>`;$('chk').disabled=true}
home();
</script></body></html>
